name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS Apple Silicon'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS Intel'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Build Desktop App
        run: pnpm --filter @dcprotocol/desktop exec tauri build ${{ matrix.args }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload macOS Apple Silicon artifacts
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            packages/dcp-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/dcp-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Upload macOS Intel artifacts
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            packages/dcp-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            packages/dcp-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            packages/dcp-desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/dcp-desktop/src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            packages/dcp-desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/dcp-desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-aarch64/**/*.dmg
            macos-aarch64/**/*.app
            macos-x86_64/**/*.dmg
            macos-x86_64/**/*.app
            linux-x86_64/**/*.deb
            linux-x86_64/**/*.rpm
            windows-x86_64/**/*.msi
            windows-x86_64/**/*.exe
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('dev-{0}', github.sha) || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && format('Development Build ({0})', github.sha) || github.ref_name }}
          body: |
            ## DCP Desktop ${{ github.event_name == 'workflow_dispatch' && format('Development Build ({0})', github.sha) || github.ref_name }}

            Cross-platform desktop application for DCP - connect AI agents to your Solana wallet and personal vault with local approval.

            ### Release notes

            - Fixed Telegram approval routing after unlinking and relinking Telegram.
            - Improved remote approval reliability for Desktop and VPS agents.
            - Added MCP support for x402 Solana payment signing.
            - Updated the bundled vault runtime used by the Desktop app.

            ### Downloads

            **macOS:**
            - Apple Silicon (M1/M2/M3): Download the `aarch64` DMG
            - Intel: Download the `x86_64` DMG

            **Windows:**
            - Download the `.msi` installer or `.exe` installer

            **Linux:**
            - Download the `.deb` package (Debian/Ubuntu)
            - Download the `.rpm` package (Fedora/RHEL)

            ### Installation

            - **macOS**: Open the DMG file and drag DCP to your Applications folder
            - **Windows**: Run the MSI or EXE installer
            - **Linux**: Install the DEB or RPM package using your package manager

            ### Features

            - Secure local data storage with encryption
            - System tray integration
            - Auto-start on system boot
            - Cross-platform support (macOS, Windows, Linux)
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          overwrite_files: true
