name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS Apple Silicon'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS Intel'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Build Desktop App
        run: |
          cd packages/dcp-desktop
          npm run tauri:build -- ${{ matrix.args }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload macOS Apple Silicon artifacts
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            packages/dcp-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/dcp-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Upload macOS Intel artifacts
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            packages/dcp-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            packages/dcp-desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            packages/dcp-desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/dcp-desktop/src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            packages/dcp-desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/dcp-desktop/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-aarch64/**/*
            macos-x86_64/**/*
            linux-x86_64/**/*
            windows-x86_64/**/*
          draft: false
          generate_release_notes: true
          prerelease: false
