version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/read-personal-data
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /examples/sign-solana-tx
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: cargo
    directory: /packages/dcp-desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
