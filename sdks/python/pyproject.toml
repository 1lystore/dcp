[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcp-sdk"
version = "0.2.0"
description = "Python SDK for DCP Vault - Connect AI agents to secure credential storage"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "DCP Protocol", email = "hello@dcp.1ly.store" }
]
keywords = [
    "dcp",
    "vault",
    "ai-agents",
    "wallet",
    "solana",
    "ethereum",
    "signing",
    "credentials"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/1lystore/dcp"
Documentation = "https://github.com/1lystore/dcp#readme"
Repository = "https://github.com/1lystore/dcp"
Issues = "https://github.com/1lystore/dcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["dcp_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
